services:
  db:
    image: postgres:16
    container_name: clubapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubapp
      POSTGRES_PASSWORD: clubapp
      POSTGRES_DB: clubapp
    ports:
      - "5432:5432"
    volumes:
      - clubapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubapp -d clubapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: docker compose --profile full up --build
  api:
    profiles: ["full"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clubapp_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clubapp:clubapp@db:5432/clubapp?schema=public
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en tu entorno o .env antes de levantar el perfil "full" — no hay valor por defecto}
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # Las NEXT_PUBLIC_* se inline-an en el bundle JS durante "next build":
      # tienen que llegar como build arg, no como `environment` de acá
      # abajo (eso solo afecta al proceso en runtime, ya tarde para Next).
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: clubapp_web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  clubapp_pgdata:
